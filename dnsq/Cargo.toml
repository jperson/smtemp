[package]
name = "dnsq"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.15", features = ["derive"] }
dns = { path = "../dns" }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.124"
tokio = { version = "1.39.2", features = ["rt", "macros"] }

[lints.clippy]
upper_case_acronyms = "allow"
