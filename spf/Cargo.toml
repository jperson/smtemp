[package]
name = "spf"
version = "0.1.0"
edition = "2021"

[dependencies]
logos = "0.14.1"
anyhow = "1.0.86"
chrono = { version = "0.4.38", features = ["unstable-locales"] }
memchr = "2.7.4"
dns = { path = "../dns" }
tokio = { version = "1.39.2", features = ["full"] }
tokio-rustls = "0.26.0"
webpki-roots = "0.26.3"
rustls-pki-types = "1.8.0"
serde = { version = "1.0.207", features = ["derive"] }
rand = "0.8.5"
fqdn = { version = "0.3.12", features = ["strict-rfc"]}
ipnet = "2.10.0"
async-recursion = "1.1.1"
