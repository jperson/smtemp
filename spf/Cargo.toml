[package]
name = "spf"
version = "0.1.0"
edition = "2021"

[dependencies]
logos = "0.14.1"
anyhow = "1.0.86"
jiff = { workspace = true }
memchr = "2.7.4"
dns = { path = "../dns" }
async-recursion = "1.1.1"
ipnet = "2.10.0"
serde = { version = "1.0.207", features = ["derive"] }
thiserror = { workspace = true }
tokio = { version = "1.39.2", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.39.2", features = ["rt", "time", "macros", "net"] }
