[package]
name = "dkim"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
sha2 = "0.10.8"
thiserror = { workspace = true }
mailparse = { path = "../mailparse" }
dns = { path = "../dns" }
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
rand_core = "0.6"
