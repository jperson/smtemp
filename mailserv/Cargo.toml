[package]
name = "mailserv"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.15", features = ["derive"] }
tokio = { version = "1.39.2", features = ["full"] }
dns = { path = "../dns" }
smtp = { path = "../smtp" }
spf = { path = "../spf" }
dkim = { path = "../dkim" }
dmarc = { path = "../dmarc" }
mailparse = { path = "../mailparse" }
base64 = "0.22.1"
tokio-rustls = "0.26"
rustls-pemfile = "2"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.3"
tracing-bunyan-formatter = "0.3.9"
uuid = { version = "1.10.0", features = ["v4", "fast-rng", "serde"] }
jiff = { workspace = true }
libc = "0.2"
thiserror = { workspace = true }
serde = { version = "1.0.210", features = ["derive"] }
toml = "0.8"
serde_json = "1.0.128"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
